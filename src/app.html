<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Satoshi: <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet"> -->
		<link href="https://api.fontshare.com/v2/css?f[]=switzer@1&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
		<title>md.boidu.dev</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					if (dark) document.documentElement.dataset.theme = 'dark';
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
